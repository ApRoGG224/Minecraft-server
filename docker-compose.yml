services:
  mc-server:
    build: .
    container_name: mc-neoforge-server
    ports:
      - "25565:25565"
    volumes:
      - .:/data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    stdin_open: true
    tty: true
    restart: unless-stopped

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit-agent
    restart: unless-stopped
    network_mode: "service:mc-server"
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
