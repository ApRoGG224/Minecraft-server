services:
  mc-server:
    build: .
    container_name: mc-neoforge-server
    ports:
      - "25565:25565"
    volumes:
      - .:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

  playit:
    image: mafen/playit-docker
    container_name: playit-agent
    restart: unless-stopped
    volumes:
      - ./playit-data:/playit
    stdin_open: true
    tty: true

